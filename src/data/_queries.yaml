# STMO query registry — which STMO (Redash) query backs each
# data/<name>.json output. Drives observablehq.config.js (dynamicPaths) and
# the shared data loader ([name].json.js): adding a query here is enough, no
# new loader file needed. The SQL itself lives on
# https://sql.telemetry.mozilla.org (via the web UI or stmo-cli), authored
# there rather than checked into this repo.
#
# Each query is fetched with its own Redash API key (query page -> API Key),
# not a shared user-level key, so one key only ever exposes that one query's
# cached results. `secretEnv` is the name of the GitHub `production`
# environment secret holding that key — see the README for `gh secret set`.
#
# To add a dashboard: create/find its STMO query, grab its per-query API
# key, add it as a `production` environment secret, then add a row below.

- name: gecko2github-trend
  title: "Gecko2Github: daily hg/git VCS time percentiles"
  queryId: 123300
  secretEnv: REDASH_API_KEY_GECKO2GITHUB_TREND

- name: gecko2github-workerpool
  title: "Gecko2Github: median clone time by worker pool"
  queryId: 123299
  secretEnv: REDASH_API_KEY_GECKO2GITHUB_WORKERPOOL

- name: gecko2github-git-heatmap
  title: "Gecko2Github: git checkout task counts by day and VCS-time bucket"
  queryId: 131164
  secretEnv: REDASH_API_KEY_GECKO2GITHUB_GIT_HEATMAP

- name: gecko2github-git-outliers
  title: "Gecko2Github: git checkout tasks above their kind/os p99.75 VCS time"
  queryId: 131163
  secretEnv: REDASH_API_KEY_GECKO2GITHUB_GIT_OUTLIERS

- name: checkout-caches-workerpool
  title: "Checkout Caches: cache hit/miss counts by worker pool"
  queryId: 123849
  secretEnv: REDASH_API_KEY_CHECKOUT_CACHES_WORKERPOOL

- name: macos-test-pools-usage
  title: "MacOS Test Pools: daily task runs, machine-hours and fleet size by pool"
  queryId: 125256
  secretEnv: REDASH_API_KEY_MACOS_TEST_POOLS_USAGE

- name: macos-test-pools-projects
  title: "MacOS Test Pools: daily task runs and machine-hours by trust domain and project"
  queryId: 125465
  secretEnv: REDASH_API_KEY_MACOS_TEST_POOLS_PROJECTS

- name: usage
  title: "CI Usage: daily task runs, machine-hours, task-attributed cost, pending time and pushes by user and project"
  queryId: 126750
  secretEnv: REDASH_API_KEY_USAGE

- name: pending-times
  title: "Pending Times: daily pending-time histogram by pool, project and priority, plus deadline-exceeded counts"
  queryId: 126751
  secretEnv: REDASH_API_KEY_PENDING_TIMES
