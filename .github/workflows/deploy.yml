# Deploys this repo to Quick on merge to main, and hourly to keep dashboards
# in step with STMO's own query refresh interval (clearing the loader cache
# first so the hourly run actually re-fetches instead of reusing a stale
# cached artifact). Originally generated by 'quick gha'.
#
# Requires the org-level GitHub Actions variable GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER
# (present in most Mozilla GitHub orgs; file a Bugzilla bug to add it if missing).
#
# Site name is resolved per run: the "site" workflow input, else a QUICK_SITE
# Actions variable (repo or org), else the default below. Keeping the default as
# the repo name makes this file generic - it works unmodified in any repo.
name: Deploy to Quick
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "observablehq.config.js"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "15 */4 * * *" # every 4 hours at :15 UTC — tune to match STMO refresh cadence
  workflow_dispatch:
    inputs:
      site:
        description: "Site name to deploy to (default: the repo name)"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DIR: dist
      QUICK_DEPLOYED_BY: github:${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: github.event_name == 'schedule'
        run: rm -rf src/.observablehq/cache
      - run: npm run build
        env:
          # One key per STMO query (see src/data/_queries.md) — each is scoped
          # to that query's cached results only, nothing else.
          REDASH_API_KEY_GECKO2GITHUB_TREND: ${{ secrets.REDASH_API_KEY_GECKO2GITHUB_TREND }}
          REDASH_API_KEY_GECKO2GITHUB_WORKERPOOL: ${{ secrets.REDASH_API_KEY_GECKO2GITHUB_WORKERPOOL }}
          REDASH_API_KEY_GECKO2GITHUB_GITTASKS: ${{ secrets.REDASH_API_KEY_GECKO2GITHUB_GITTASKS }}
          REDASH_API_KEY_CHECKOUT_CACHES_WORKERPOOL: ${{ secrets.REDASH_API_KEY_CHECKOUT_CACHES_WORKERPOOL }}
          REDASH_API_KEY_MACOS_TEST_POOLS_USAGE: ${{ secrets.REDASH_API_KEY_MACOS_TEST_POOLS_USAGE }}
          REDASH_API_KEY_MACOS_TEST_POOLS_PROJECTS: ${{ secrets.REDASH_API_KEY_MACOS_TEST_POOLS_PROJECTS }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: quick-gha-deploy@moz-fx-quick-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Quick
        env:
          SITE: ${{ inputs.site || vars.QUICK_SITE || 'fxci' }}
        run: |
          gcloud storage cp gs://moz-fx-quick-prod-cli/quick-linux-amd64 ./quick
          chmod +x ./quick
          ./quick deploy "$DIR" "$SITE" --mirror --yes
